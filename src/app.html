<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,750&display=swap"
		/>
		<script>
			// Pre-paint theme bootstrap. Keep the storage key, accepted values, and default
			// in sync with src/lib/theme.js.
			(() => {
				try {
					const root = document.documentElement;
					const storedTheme = localStorage.getItem('dating-theme');
					const theme = storedTheme === 'dark' ? 'dark' : 'light';

					root.dataset.theme = theme;
					root.style.colorScheme = theme;
				} catch {
					document.documentElement.dataset.theme = 'light';
					document.documentElement.style.colorScheme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
